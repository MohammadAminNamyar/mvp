spring:
  datasource:
    url: jdbc:h2:mem:squares;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: true

springdoc:
  swagger-ui:
    path: /tpi/rest/swagger-ui/index.html

squares:
  reservationTtlSeconds: 30
  adminToken: admin
  houseOnLock: true
  showPurchaserNames: false
  authEnabled: false
  authUserHeader: X-User-Id

logging:
  level:
    org.hibernate.SQL: warn
