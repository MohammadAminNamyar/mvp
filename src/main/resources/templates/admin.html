<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Squares Pool Admin</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body class="theme-dark">
<div class="app-shell">
    <header class="top-nav">
        <div class="brand">
            <span class="logo">■</span>
            <div>
                <div class="brand-title">Squares Pool</div>
                <div class="brand-subtitle">Admin Console</div>
            </div>
        </div>
        <nav class="nav-actions">
            <a class="nav-link" href="/">Back to Lobby</a>
            <a class="nav-link" href="#" id="logout-nav">Logout</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero-card">
            <div class="hero-heading">
                <div>
                    <h1>Admin Controls</h1>
                    <p class="muted">Create boards, lock games, and confirm quarters.</p>
                </div>
            </div>
        </section>

        <div class="admin-panels">
            <section class="admin-panel">
                <h2>Create Board</h2>
                <label class="admin-field" for="admin-token">
                    <span>Admin token</span>
                    <input type="text" id="admin-token" placeholder="Admin token" value="admin" />
                </label>
                <h2>Visibility Settings</h2>
                <label class="toggle-row">
                    <input type="checkbox" id="show-purchaser-names" />
                    Show purchaser names to players
                </label>
                <button id="save-settings">Save Settings</button>
                <label class="admin-field" for="board-name">
                    <span>Board name</span>
                    <input type="text" id="board-name" placeholder="Board name" />
                </label>
                <label class="admin-field" for="fixture-select">
                    <span>Fixtures</span>
                    <select id="fixture-select">
                        <option value="">Select a fixture</option>
                    </select>
                </label>
                <label class="admin-field" for="sport-type">
                    <span>Sport type</span>
                    <input type="text" id="sport-type" placeholder="Sport type (e.g., Football)" />
                </label>
                <label class="admin-field" for="game-name">
                    <span>Game name</span>
                    <input type="text" id="game-name" placeholder="Game name (e.g., Week 1 Matchup)" />
                </label>
                <label class="admin-field" for="game-id">
                    <span>Game group ID</span>
                    <input type="text" id="game-id" placeholder="Game group ID (optional)" />
                </label>
                <label class="admin-field" for="home-team">
                    <span>Home team</span>
                    <input type="text" id="home-team" placeholder="Home team" />
                </label>
                <label class="admin-field" for="away-team">
                    <span>Away team</span>
                    <input type="text" id="away-team" placeholder="Away team" />
                </label>
                <label class="admin-field" for="price-cents">
                    <span>Price (cents)</span>
                    <input type="number" id="price-cents" placeholder="Price (cents)" value="500" />
                </label>
                <label class="admin-field" for="house-percent">
                    <span>House percent</span>
                    <input type="number" id="house-percent" placeholder="House percent" value="10" />
                </label>
                <label class="admin-field" for="min-activate">
                    <span>Min squares to activate</span>
                    <input type="number" id="min-activate" placeholder="Min squares to activate" value="0" />
                </label>
                <label class="admin-field" for="payout-q1">
                    <span>Q1 payout %</span>
                    <input type="number" id="payout-q1" placeholder="Q1 payout %" value="12.5" step="0.01" />
                </label>
                <label class="admin-field" for="payout-q2">
                    <span>Half payout %</span>
                    <input type="number" id="payout-q2" placeholder="Half payout %" value="25" step="0.01" />
                </label>
                <label class="admin-field" for="payout-q3">
                    <span>Q3 payout %</span>
                    <input type="number" id="payout-q3" placeholder="Q3 payout %" value="12.5" step="0.01" />
                </label>
                <label class="admin-field" for="payout-q4">
                    <span>Final payout %</span>
                    <input type="number" id="payout-q4" placeholder="Final payout %" value="50" step="0.01" />
                </label>
                <button id="create-board">Create Board</button>
                <button id="update-board" type="button">Update Board</button>
            </section>

            <section class="admin-panel">
                <h2>Board Directory</h2>
                <div class="board-list" id="admin-board-list"></div>
            </section>

            <section class="admin-panel">
                <h2>Board Actions</h2>
                <label class="admin-field" for="board-id">
                    <span>Board ID</span>
                    <input type="number" id="board-id" placeholder="Board ID" />
                </label>
                <label class="admin-field" for="action-game-id">
                    <span>Game ID</span>
                    <input type="text" id="action-game-id" placeholder="Game ID" readonly />
                </label>
                <label class="admin-field" for="quarter-select">
                    <span>Quarter payout</span>
                    <select id="quarter-select">
                        <option value="Q1">Confirm Q1 (1st)</option>
                        <option value="Q2">Confirm Q2 (half)</option>
                        <option value="Q3">Confirm Q3 (3rd)</option>
                        <option value="Q4">Confirm Q4 (final)</option>
                    </select>
                </label>
                <button id="start-game">Start Game (Lock)</button>
                <label class="admin-field" for="home-score">
                    <span>Home score</span>
                    <input type="number" id="home-score" placeholder="Home score" value="0" />
                </label>
                <label class="admin-field" for="away-score">
                    <span>Away score</span>
                    <input type="number" id="away-score" placeholder="Away score" value="0" />
                </label>
                <label class="admin-field" for="game-clock">
                    <span>Game clock</span>
                    <input type="text" id="game-clock" placeholder="Game clock (e.g., 32')" value="-" />
                </label>
                <button id="update-score">Update Score</button>
                <button id="confirm-quarter">Payout</button>
                <button id="reset-board">Reset Board</button>
                <button id="delete-board" type="button">Delete Board</button>
            </section>
        </div>

        <p class="notice" id="admin-message"></p>
    </main>
</div>

<script src="/admin.js?v=20260121-2"></script>
<script>
    (function () {
        const logoutNav = document.getElementById('logout-nav');
        if (!logoutNav) {
            return;
        }
        logoutNav.addEventListener('click', event => {
            event.preventDefault();
            localStorage.removeItem('squares.username');
            localStorage.removeItem('squares.serviceTicket');
            localStorage.removeItem('squares.role');
            window.location.href = '/';
        });
    })();
</script>
</body>
</html>
