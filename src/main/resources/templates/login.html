<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Squares Pool Login</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body class="theme-dark">
<div class="app-shell">
    <header class="top-nav">
        <div class="brand">
            <span class="logo">■</span>
            <div>
                <div class="brand-title">Squares Pool</div>
                <div class="brand-subtitle">Login</div>
            </div>
        </div>
        <nav class="nav-actions">
            <a class="nav-link" href="/">Back to Lobby</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="login-card card">
            <h1>Access the MVP</h1>
            <p class="muted">Sign in with your CCA credentials to continue.</p>
            <form id="login-form" class="login-form">
                <label class="field">
                    <span>Username</span>
                    <input type="text" id="login-username" autocomplete="username" required />
                </label>
                <label class="field">
                    <span>Password</span>
                    <input type="password" id="login-password" autocomplete="current-password" required />
                </label>
                <button type="submit" class="primary-btn">Sign in</button>
                <div class="notice" id="login-message"></div>
            </form>
        </section>
    </main>
</div>

<script src="/login.js"></script>
</body>
</html>
