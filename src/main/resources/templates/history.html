<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Player History</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body class="theme-dark">
<div class="app-shell">
    <header class="top-nav">
        <div class="brand">
            <span class="logo">■</span>
            <div>
                <div class="brand-title">Squares Pool</div>
                <div class="brand-subtitle">Player History</div>
            </div>
        </div>
        <button class="hamburger-menu" id="hamburger-menu" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-actions" id="nav-actions">
            <a class="nav-link" href="/">Back to Lobby</a>
            <a class="nav-link" href="/history">History</a>
            <span class="status-pill" id="history-user"></span>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero-card">
            <div class="hero-heading">
                <div>
                    <h1>Win/Loss History</h1>
                    <p class="muted">Review completed boards, your squares, and payouts.</p>
                </div>
            </div>
        </section>

        <section class="history-grid" id="history-grid"></section>
    </main>
</div>

<script src="/history.js"></script>
<script>
    (function () {
        const hamburgerMenu = document.getElementById('hamburger-menu');
        const navActions = document.getElementById('nav-actions');

        // Hamburger menu toggle
        if (hamburgerMenu && navActions) {
            hamburgerMenu.addEventListener('click', () => {
                const isActive = hamburgerMenu.classList.toggle('active');
                navActions.classList.toggle('active');
                document.body.classList.toggle('nav-open', isActive);
            });

            // Close menu when clicking on a nav link
            navActions.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', () => {
                    hamburgerMenu.classList.remove('active');
                    navActions.classList.remove('active');
                    document.body.classList.remove('nav-open');
                });
            });

            // Close menu when clicking outside (on the overlay background)
            navActions.addEventListener('click', (e) => {
                if (e.target === navActions) {
                    hamburgerMenu.classList.remove('active');
                    navActions.classList.remove('active');
                    document.body.classList.remove('nav-open');
                }
            });
        }
    })();
</script>
</body>
</html>
