<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Squares Pool</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body class="theme-dark">
<div class="app-shell">
    <header class="top-nav">
        <div class="brand">
            <span class="logo">■</span>
            <div>
                <div class="brand-title">Squares Pool</div>
                <div class="brand-subtitle">MVP Lobby</div>
            </div>
        </div>
        <nav class="nav-actions">
            <a class="nav-link" href="/login">Login</a>
            <a class="nav-link" href="/admin">Admin Console</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero-card">
            <div class="hero-heading">
                <div>
                    <h1>Squares Pool MVP</h1>
                    <p class="muted">Open a board to purchase squares and track winners in real time.</p>
                </div>
            </div>
        </section>

        <div class="card">
            <h2>Boards</h2>
            <ul>
                <li th:if="${#lists.isEmpty(boards)}">No boards yet. Create one in Admin.</li>
                <li th:each="board : ${boards}">
                    <a th:href="@{/boards/{id}/view(id=${board.id})}" th:text="${board.name}">Board</a>
                    (<span th:text="${board.homeTeam}">Home</span> vs <span th:text="${board.awayTeam}">Away</span>)
                </li>
            </ul>
        </div>

        <p class="notice">Use the admin page to start the game, lock boards, and confirm quarters.</p>
    </main>
</div>
</body>
</html>
